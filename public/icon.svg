<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Static twin of src/components/MesadaMark.tsx. Literal hex, not CSS vars:
       this file is served before React boots and cannot read custom properties.
       Keep the geometry in sync with that component by hand. -->
  <rect width="64" height="64" rx="14" fill="#fef3ec"/>
  <g data-coin="bottom">
    <rect x="15" y="38" width="34" height="7" fill="#3d2c2e"/>
    <ellipse cx="32" cy="45" rx="17" ry="6" fill="#3d2c2e"/>
    <ellipse cx="32" cy="38" rx="17" ry="6" fill="#86685b"/>
  </g>
  <g data-coin="middle">
    <rect x="15" y="29" width="34" height="7" fill="#3d2c2e"/>
    <ellipse cx="32" cy="36" rx="17" ry="6" fill="#3d2c2e"/>
    <ellipse cx="32" cy="29" rx="17" ry="6" fill="#86685b"/>
  </g>
  <g data-coin="top">
    <rect x="15" y="20" width="34" height="7" fill="#5e7454"/>
    <ellipse cx="32" cy="27" rx="17" ry="6" fill="#5e7454"/>
    <ellipse cx="32" cy="20" rx="17" ry="6" fill="#86a578"/>
  </g>
</svg>
